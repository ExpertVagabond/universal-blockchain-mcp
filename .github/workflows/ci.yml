name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20, 22, 24]
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run lint
      run: npm run lint --if-present
    
    - name: Run type check
      run: npm run type-check --if-present
    
    - name: Run tests
      run: npm test --if-present
    
    - name: Run build
      run: npm run build --if-present

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run security audit
      run: npm audit --audit-level moderate

    # CodeQL was previously invoked here as a bare `analyze` step with a `languages`
    # input, which is invalid — analyze requires a prior `init`, and it failed every
    # run with "Has the 'init' action been called?". Rather than hand-roll init+analyze
    # (which conflicts with CodeQL Default Setup if that is enabled on the repo),
    # enable scanning via Settings > Code security > CodeQL analysis > Default setup.
    # This job now gates on `npm audit` alone, which is a real, passing check.

  release:
    needs: [ci, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build
      run: npm run build --if-present
    
    - name: Semantic Release
      uses: cycjimmy/semantic-release-action@v6
      with:
        semantic_version: 18
        extra_plugins: |
          @semantic-release/changelog
          @semantic-release/git
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
