[package]
name = "universal-blockchain-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server for ZetaChain universal blockchain -- CLI wrapper for zetachain CLI with cross-chain operations"
license = "MIT"
authors = ["Purple Squirrel Media LLC"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
